name: Render Quarto Document

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.3.450

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install R dependencies
        run: |
          R -e 'install.packages(c("rmarkdown", "knitr"), repos = "https://cloud.r-project.org")'

      - name: Render Quarto document to reveal.js
        run: |
          TARGET_FILE=$(cat target.txt | tail -n 1)
          echo "Rendering file: $TARGET_FILE"
          quarto render "$TARGET_FILE" --to revealjs

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Convert HTML to PDF
        run: |
          TARGET_FILE=$(cat target.txt | tail -n 1)
          BASE_NAME="${TARGET_FILE%.*}"
          HTML_FILE="${BASE_NAME}.html"
          PDF_FILE="${BASE_NAME}.pdf"
          
          echo "Converting $HTML_FILE to $PDF_FILE"
          chrome --headless --disable-gpu --print-to-pdf="$PDF_FILE" "file://$(pwd)/$HTML_FILE"

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v3
        with:
          name: presentation-html
          path: ./*.html
          
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v3
        with:
          name: presentation-pdf
          path: ./*.pdf